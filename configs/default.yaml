data:
  train_path: data/X_train.csv
  test_path: data/X_test.csv
  target_path: data/y_train.csv

features:
  features:
    - momentum
    - volatility
    - zscore
    - autocorr

  horizons:
    momentum: [3, 5, 10, 15, 20]  # List of horizons like in the notebook
    volatility: [20]
    zscore: [20]
    autocorr: [20]

model:
  task: regression
  model_name: ridge
  params:
    alpha: 1.0

cv:
  n_splits: 5
  shuffle: true
  random_state: 42

experiment:
  name: default
  seed: 42